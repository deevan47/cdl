<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Notifications</h1>

    <div *ngIf="loading" class="flex justify-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
    </div>

    <div *ngIf="!loading && notifications.length === 0"
        class="text-center py-12 bg-white dark:bg-gray-800 rounded-lg shadow">
        <p class="text-gray-500 dark:text-gray-400">No notifications yet.</p>
    </div>

    <div *ngIf="!loading && notifications.length > 0" class="space-y-4">
        <div *ngFor="let notification of notifications" [class.bg-blue-50]="!notification.isRead"
            [class.dark:bg-blue-900_20]="!notification.isRead"
            class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow border-l-4 transition-all hover:shadow-md"
            [class.border-blue-500]="!notification.isRead" [class.border-gray-200]="notification.isRead"
            [class.dark:border-gray-700]="notification.isRead" (click)="onNotificationClick(notification)">

            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-semibold text-gray-800 dark:text-white mb-1">{{ notification.title }}</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm mb-2">{{ notification.message }}</p>
                    <span class="text-xs text-gray-400">{{ notification.created_at | date:'medium' }}</span>
                </div>
                <div *ngIf="!notification.isRead" class="h-2 w-2 bg-blue-500 rounded-full"></div>
            </div>

            <div *ngIf="notification.link" class="mt-2">
                <a [routerLink]="notification.link"
                    class="text-sm text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300 font-medium">
                    View Details →
                </a>
            </div>
        </div>
    </div>
</div>
