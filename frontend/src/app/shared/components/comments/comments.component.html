<div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6">
  <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Project Comments</h3>

  <!-- Input Area -->
  <div class="flex gap-4 mb-6">
    <img [src]="currentUser?.avatar || 'assets/default-avatar.png'" class="w-10 h-10 rounded-full object-cover">
    <div class="flex-1">
      <textarea [(ngModel)]="newCommentContent" placeholder="Add a comment..."
        class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none h-24"></textarea>
      <div class="flex justify-end mt-2">
        <button (click)="addComment()" [disabled]="!newCommentContent.trim()"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          Post Comment
        </button>
      </div>
    </div>
  </div>

  <!-- Comments List Container -->
  <div class="space-y-6">

    <!-- Loading Spinner -->
    <div *ngIf="loading" class="text-center py-4">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
    </div>

    <!-- Actual Comments List (Only show when not loading or if we have comments) -->
    <ng-container *ngIf="!loading">
      <div *ngFor="let comment of comments" class="flex gap-4">
        <img [src]="comment.user?.avatar || 'assets/default-avatar.png'" class="w-10 h-10 rounded-full object-cover">
        <div class="flex-1">
          <div class="bg-gray-50 dark:bg-gray-700/50 rounded-lg p-4">
            <div class="flex justify-between items-start mb-1">
              <span class="font-semibold text-gray-900 dark:text-white">{{ comment.user?.name || 'Unknown User'
                }}</span>
              <span class="text-xs text-gray-500 dark:text-gray-400">{{ comment.createdAt | date:'medium' }}</span>
            </div>
            <p class="text-gray-700 dark:text-gray-300 whitespace-pre-wrap">{{ comment.content }}</p>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="comments.length === 0" class="text-center py-8 text-gray-500 dark:text-gray-400">
        No comments yet. Be the first to start the discussion!
      </div>
    </ng-container>

  </div>
</div>
