<div *ngIf="showModal"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 modal-backdrop"
  (click)="onBackdropClick($event)">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md" (click)="$event.stopPropagation()">
    <div class="p-6">
      <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Add New Task</h3>

      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Task Name -->
        <div>
          <label for="taskName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Task Name *
          </label>
          <input type="text" id="taskName" formControlName="name"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
            placeholder="Enter task name">
          <div *ngIf="taskForm.get('name')?.invalid && taskForm.get('name')?.touched" class="text-red-500 text-xs mt-1">
            Task name is required
          </div>
        </div>

        <!-- Assign User -->
        <div>
          <label for="assignedUser" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Assign User
          </label>
          <select id="assignedUser" formControlName="assignedUserId"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
            <option value="">Select User...</option>
            <option *ngFor="let user of availableManagers" [value]="user.id">
              {{ user.name }}
            </option>
          </select>
        </div>

        <!-- Start Date -->
        <div>
          <label for="startDate" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Start Date *
          </label>
          <input type="date" id="startDate" formControlName="startDate"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
          <div *ngIf="taskForm.get('startDate')?.invalid && taskForm.get('startDate')?.touched"
            class="text-red-500 text-xs mt-1">
            Start date is required
          </div>
        </div>

        <!-- End Date -->
        <div>
          <label for="endDate" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            End Date *
          </label>
          <input type="date" id="endDate" formControlName="endDate" [min]="taskForm.get('startDate')?.value"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
          <div *ngIf="taskForm.get('endDate')?.invalid && taskForm.get('endDate')?.touched"
            class="text-red-500 text-xs mt-1">
            End date is required
          </div>
        </div>

        <!-- Form Actions -->
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" (click)="closeModal()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition">
            Cancel
          </button>
          <button type="submit" [disabled]="!taskForm.valid || isSubmitting"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-2">
            <span *ngIf="isSubmitting"
              class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
            {{ isSubmitting ? 'Creating...' : 'Create Task' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
